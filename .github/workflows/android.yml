name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pinned: this image ships the Android SDK, and ubuntu-latest is moving to Ubuntu 26 where setup-android fails.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # needed to publish the APK as a release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already has the Android SDK; just point Gradle at it and add the pieces this app needs.
      - name: Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khodiyar-dairy-billing-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Every build of main becomes a release, so the phone can install from
      # https://github.com/<owner>/<repo>/releases/latest/download/khodiyar-dairy-billing.apk
      - name: Name APK for release
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk khodiyar-dairy-billing.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Khodiyar Dairy Billing (build ${{ github.run_number }})
          body: |
            Debug APK built from ${{ github.sha }}.
            On your phone: tap khodiyar-dairy-billing.apk below, then Install.
          files: khodiyar-dairy-billing.apk
          make_latest: true

      # Keep only the newest APK on the releases page.
      - name: Remove older releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' |
            grep -vx "build-${{ github.run_number }}" |
            while read -r tag; do gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
